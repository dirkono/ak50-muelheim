name: Golf-Scraper Auto-Update

on:
  workflow_dispatch:
  schedule:
    # 1. Reguläre Samstags-Spieltage (6): 12:00 bis 22:55 Uhr MESZ (10-20 UTC) alle 5 Minuten
    - cron: '*/5 10-20 * * 6'
    # 2. Sonntage (0) & Feiertags-Wochentage (Mo=1, Do=4, Fr=5): 12:00 bis 22:30 Uhr MESZ alle 30 Minuten
    - cron: '*/30 10-20 * * 0,1,4,5'

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        run: pip install requests beautifulsoup4

      - name: Scraper ausführen
        run: python scraper.py --local

      - name: Änderungen prüfen und veröffentlichen
        run: |
          git config user.name "Golf-Scraper Bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html app.js manifest.json sw.js
          git diff --staged --quiet || (git commit -m "Auto-Update Ergebnisse" && git push)
